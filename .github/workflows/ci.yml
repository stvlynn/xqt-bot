name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      - name: build (host)
        run: go build ./...
      - name: build (js/wasm)
        run: GOOS=js GOARCH=wasm go build ./...
